name: Build and Release CV PDFs

on:
  push:
    branches:
      - master
    tags:
      - v*
  workflow_dispatch:

concurrency:
  group: cv-${{ github.ref }}
  cancel-in-progress: true

env:
  TECTONIC_VERSION: 0.17.0

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Cache Tectonic packages
        uses: actions/cache@v6
        with:
          path: ~/.cache/Tectonic
          key: tectonic-${{ env.TECTONIC_VERSION }}-${{ hashFiles('**/*.tex') }}
          restore-keys: tectonic-${{ env.TECTONIC_VERSION }}-

      - name: Install Tectonic and fonts
        run: |
          curl -fsSL "https://github.com/tectonic-typesetting/tectonic/releases/download/tectonic%40${TECTONIC_VERSION}/tectonic-${TECTONIC_VERSION}-x86_64-unknown-linux-musl.tar.gz" \
            | tar -xz -C /usr/local/bin tectonic
          # Liberation Sans is metric-compatible with Arial, the font used locally on macOS
          if ! fc-list | grep -qi "Liberation Sans"; then
            sudo apt-get update -q && sudo apt-get install -yq fonts-liberation
          fi

      - name: Compile PDF résumés
        run: make build_all

      - name: Prepare artifacts
        run: |
          mkdir -p dist
          cp build/english.pdf dist/HarunSokullu_EN.pdf
          cp build/turkish.pdf dist/HarunSokullu_TR.pdf
          cd dist && sha256sum *.pdf > CHECKSUMS.txt

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: resume-pdfs
          path: dist
          if-no-files-found: error

  release:
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          name: resume-pdfs
          path: dist

      - name: Update latest tag
        if: github.ref == 'refs/heads/master'
        uses: actions/github-script@v9
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const tagRef = 'tags/latest';
            const sha = context.sha;

            try {
              await github.rest.git.getRef({ owner, repo, ref: tagRef });
              await github.rest.git.updateRef({ owner, repo, ref: tagRef, sha, force: true });
            } catch (error) {
              if (error.status === 404) {
                await github.rest.git.createRef({ owner, repo, ref: `refs/${tagRef}`, sha });
              } else {
                throw error;
              }
            }

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref == 'refs/heads/master' && 'latest' || github.ref_name }}
          name: ${{ github.ref == 'refs/heads/master' && 'CV (latest)' || format('CV {0}', github.ref_name) }}
          generate_release_notes: true
          target_commitish: ${{ github.sha }}
          overwrite_files: true
          fail_on_unmatched_files: true
          files: dist/*
